name: Deploy to Environments

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: 'plan'
        options:
          - plan
          - apply

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.x

      - name: Validate environment
        run: |
          if [[ ! "${{ inputs.environment }}" =~ ^(dev|staging|production)$ ]]; then
            echo "Invalid environment: ${{ inputs.environment }}"
            exit 1
          fi

      - name: Run deployment script
        run: |
          ./scripts/deploy.sh ${{ inputs.environment }} ${{ inputs.action }}
        env:
          # WARNING: This workflow is currently non-functional - AWS credentials are not configured.
          # 
          # To enable deployments, configure AWS credentials using one of these methods:
          # 
          # Option 1 (Quick but less secure): Use GitHub secrets with long-lived credentials
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # 
          # Option 2 (Recommended): Use OIDC authentication with AWS IAM roles
          # See docs/FUTURE_IMPROVEMENTS.md for OIDC implementation guide.
          # This provides automatic credential rotation and better security.
          #
          # DO NOT merge or enable this workflow until credentials are properly configured.
          TF_IN_AUTOMATION: true

      - name: Upload plan artifact
        if: inputs.action == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: terraform/environments/${{ inputs.environment }}/tfplan
          retention-days: 5

      - name: Deployment summary
        run: |
          echo "### Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Action:** ${{ inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
