name: Security System CI/CD

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov
    
    - name: Run tests with coverage
      run: |
        pytest test_starlink_security.py -v --cov=security --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r security/ starlink_security.py -f json -o bandit-report.json || true
        bandit -r security/ starlink_security.py
    
    - name: Check dependencies for vulnerabilities
      run: |
        safety check --json || true
        safety check
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff black isort mypy
    
    - name: Run Ruff
      run: |
        ruff check . --output-format=github
    
    - name: Check code formatting with Black
      run: |
        black --check --diff .
    
    - name: Check import ordering with isort
      run: |
        isort --check-only --diff .
    
    - name: Run mypy type checking
      run: |
        mypy . --ignore-missing-imports || true

  comment-pr:
    name: Comment Test Results on PR
    runs-on: ubuntu-latest
    needs: [test, security-scan, lint]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Comment PR
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const testStatus = '${{ needs.test.result }}';
          const securityStatus = '${{ needs.security-scan.result }}';
          const lintStatus = '${{ needs.lint.result }}';
          
          const statusEmoji = (status) => {
            if (status === 'success') return '✅';
            if (status === 'failure') return '❌';
            return '⚠️';
          };
          
          const comment = `## 🔍 CI/CD Pipeline Results
          
          | Check | Status |
          |-------|--------|
          | Tests | ${statusEmoji(testStatus)} ${testStatus} |
          | Security Scan | ${statusEmoji(securityStatus)} ${securityStatus} |
          | Code Quality | ${statusEmoji(lintStatus)} ${lintStatus} |
          
          ### 📊 Details
          - **Python Versions Tested**: 3.10, 3.11, 3.12
          - **Security Tools**: Bandit, Safety
          - **Linting Tools**: Ruff, Black, isort, mypy
          
          ${testStatus === 'success' && securityStatus === 'success' && lintStatus === 'success' 
            ? '✨ All checks passed! Ready for review.' 
            : '⚠️ Some checks failed. Please review the details above.'}
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
