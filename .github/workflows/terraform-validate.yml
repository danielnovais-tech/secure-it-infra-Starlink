name: Terraform Validation and Testing (Prod)

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-validate.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.6.x
  TF_WORKDIR_BASE: terraform/environments
  # If you use cloud creds, configure in repository secrets and export here or in steps.

jobs:
  validate:
    name: Validate & Lint (dev, staging, production)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, production]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ env.TF_WORKDIR_BASE }}/${{ matrix.environment }}/.terraform
          key: tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ hashFiles(format('{0}/{1}/**/*.tf', env.TF_WORKDIR_BASE, matrix.environment)) }}
          restore-keys: |
            tf-${{ runner.os }}-${{ env.TF_VERSION }}-

      - name: Terraform Format Check
        run: |
          cd $TF_WORKDIR_BASE/${{ matrix.environment }}
          terraform fmt -check -recursive

      - name: Terraform Init (no backend for static validation)
        run: |
          cd $TF_WORKDIR_BASE/${{ matrix.environment }}
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd $TF_WORKDIR_BASE/${{ matrix.environment }}
          terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Cache tflint
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}
          restore-keys: |
            tflint-${{ runner.os }}-

      - name: Lint Terraform with tflint
        run: |
          cd $TF_WORKDIR_BASE/${{ matrix.environment }}
          tflint --init
          tflint --format compact
        # Fail the job if linting finds issues you deem blocking; set continue-on-error: false in prod
        continue-on-error: false

  security-scan:
    name: Security Scan (tfsec, hard fail)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec (hard fail)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
          # Hard fail to enforce compliance
          soft_fail: false

  plan:
    name: Terraform Plan (PR only)
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        environment: [dev, staging]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ env.TF_WORKDIR_BASE }}/${{ matrix.environment }}/.terraform
          key: tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ hashFiles(format('{0}/{1}/**/*.tf', env.TF_WORKDIR_BASE, matrix.environment)) }}
          restore-keys: |
            tf-${{ runner.os }}-${{ env.TF_VERSION }}-

      - name: Terraform Init (backend enabled)
        working-directory: ${{ env.TF_WORKDIR_BASE }}/${{ matrix.environment }}
        run: |
          # If you use a remote backend, ensure backend config files or secrets are present
          terraform init -input=false

      - name: Select/Create Workspace
        working-directory: ${{ env.TF_WORKDIR_BASE }}/${{ matrix.environment }}
        run: |
          terraform workspace select ${{ matrix.environment }} || terraform workspace new ${{ matrix.environment }}

      - name: Terraform Plan (capture output)
        id: plan
        working-directory: ${{ env.TF_WORKDIR_BASE }}/${{ matrix.environment }}
        run: |
          set -e
          terraform plan -no-color -input=false | tee plan.out

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.environment }}
          path: ${{ env.TF_WORKDIR_BASE }}/${{ matrix.environment }}/plan.out

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.environment }}';
            const path = `${process.env.TF_WORKDIR_BASE}/${env}/plan.out`;
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No plan output found.';
            const output = `#### Terraform Plan for \`${env}\` 📖

            <details><summary>Show Plan</summary>

            \`\`\`
            ${plan}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # Optional: gate merges with a summary status (can be used with branch protection)
  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [validate, security-scan, plan]
    if: github.event_name == 'pull_request'
    steps:
      - name: Post check summary
        uses: actions/github-script@v7
        with:
          script: |
            const body = `
            ✅ Validation and linting passed
            ✅ Security scan (tfsec) enforced
            ✅ Plan comments posted for dev and staging

            Ensure reviewers check the PR comments for environment-specific plans.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })
