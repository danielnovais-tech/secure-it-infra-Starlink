apiVersion: v1
kind: Namespace
metadata:
  name: pulsar
  labels:
    app: pulsar
    component: reliability-integration
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: pulsar
  labels:
    app: pulsar
    component: zookeeper
spec:
  ports:
  - port: 2181
    name: client
  - port: 2888
    name: server
  - port: 3888
    name: leader-election
  clusterIP: None
  selector:
    app: pulsar
    component: zookeeper
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: pulsar
  labels:
    app: pulsar
    component: zookeeper
spec:
  serviceName: zookeeper
  replicas: 3
  selector:
    matchLabels:
      app: pulsar
      component: zookeeper
  template:
    metadata:
      labels:
        app: pulsar
        component: zookeeper
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - pulsar
              - key: component
                operator: In
                values:
                - zookeeper
            topologyKey: kubernetes.io/hostname
      containers:
      - name: zookeeper
        image: apachepulsar/pulsar:3.2.0
        command: ["sh", "-c"]
        args:
        - >
          bin/apply-config-from-env.py conf/zookeeper.conf &&
          bin/generate-zookeeper-config.sh conf/zookeeper.conf &&
          bin/pulsar zookeeper
        ports:
        - containerPort: 2181
          name: client
        - containerPort: 2888
          name: server
        - containerPort: 3888
          name: leader-election
        env:
        - name: PULSAR_MEM
          value: "-Xms256m -Xmx256m"
        volumeMounts:
        - name: datadir
          mountPath: /pulsar/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bookkeeper
  namespace: pulsar
  labels:
    app: pulsar
    component: bookkeeper
spec:
  ports:
  - port: 3181
    name: client
  clusterIP: None
  selector:
    app: pulsar
    component: bookkeeper
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bookkeeper
  namespace: pulsar
  labels:
    app: pulsar
    component: bookkeeper
spec:
  serviceName: bookkeeper
  replicas: 3
  selector:
    matchLabels:
      app: pulsar
      component: bookkeeper
  template:
    metadata:
      labels:
        app: pulsar
        component: bookkeeper
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - pulsar
              - key: component
                operator: In
                values:
                - bookkeeper
            topologyKey: kubernetes.io/hostname
      initContainers:
      - name: wait-zookeeper-ready
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z zookeeper-0.zookeeper 2181; do echo waiting for zookeeper; sleep 2; done"]
      containers:
      - name: bookkeeper
        image: apachepulsar/pulsar:3.2.0
        command: ["sh", "-c"]
        args:
        - >
          bin/apply-config-from-env.py conf/bookkeeper.conf &&
          bin/pulsar bookie
        ports:
        - containerPort: 3181
          name: client
        env:
        - name: PULSAR_MEM
          value: "-Xms512m -Xmx512m"
        - name: zkServers
          value: "zookeeper-0.zookeeper:2181,zookeeper-1.zookeeper:2181,zookeeper-2.zookeeper:2181"
        volumeMounts:
        - name: journal-disk
          mountPath: /pulsar/data/bookkeeper/journal
        - name: ledgers-disk
          mountPath: /pulsar/data/bookkeeper/ledgers
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
  volumeClaimTemplates:
  - metadata:
      name: journal-disk
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
  - metadata:
      name: ledgers-disk
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: pulsar
  labels:
    app: pulsar
    component: broker
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: pulsar
    port: 6650
    targetPort: 6650
  selector:
    app: pulsar
    component: broker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: pulsar
  labels:
    app: pulsar
    component: broker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pulsar
      component: broker
  template:
    metadata:
      labels:
        app: pulsar
        component: broker
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - pulsar
              - key: component
                operator: In
                values:
                - broker
            topologyKey: kubernetes.io/hostname
      initContainers:
      - name: wait-bookkeeper-ready
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z bookkeeper-0.bookkeeper 3181; do echo waiting for bookkeeper; sleep 2; done"]
      containers:
      - name: broker
        image: apachepulsar/pulsar:3.2.0
        command: ["sh", "-c"]
        args:
        - >
          bin/apply-config-from-env.py conf/broker.conf &&
          bin/pulsar broker
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 6650
          name: pulsar
        env:
        - name: PULSAR_MEM
          value: "-Xms512m -Xmx512m"
        - name: zookeeperServers
          value: "zookeeper-0.zookeeper:2181,zookeeper-1.zookeeper:2181,zookeeper-2.zookeeper:2181"
        - name: configurationStoreServers
          value: "zookeeper-0.zookeeper:2181,zookeeper-1.zookeeper:2181,zookeeper-2.zookeeper:2181"
        - name: clusterName
          value: "pulsar-cluster"
        livenessProbe:
          httpGet:
            path: /admin/v2/brokers/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /admin/v2/brokers/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: pulsar-manager
  namespace: pulsar
  labels:
    app: pulsar
    component: pulsar-manager
spec:
  type: LoadBalancer
  ports:
  - name: ui
    port: 9527
    targetPort: 9527
  - name: backend
    port: 7750
    targetPort: 7750
  selector:
    app: pulsar
    component: pulsar-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar-manager
  namespace: pulsar
  labels:
    app: pulsar
    component: pulsar-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsar
      component: pulsar-manager
  template:
    metadata:
      labels:
        app: pulsar
        component: pulsar-manager
    spec:
      containers:
      - name: pulsar-manager
        image: apachepulsar/pulsar-manager:v0.4.0
        ports:
        - containerPort: 9527
          name: ui
        - containerPort: 7750
          name: backend
        env:
        - name: SPRING_CONFIGURATION_FILE
          value: /pulsar-manager/pulsar-manager/application.properties
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
