# Pulsar Broker Configuration for Reliability Integrations

# Cluster name
clusterName=pulsar-cluster

# ZooKeeper connection
zookeeperServers=zookeeper:2181
configurationStoreServers=zookeeper:2181

# Broker service ports
brokerServicePort=6650
brokerServicePortTls=6651
webServicePort=8080
webServicePortTls=8443

# Message retention and deduplication
defaultRetentionTimeInMinutes=10080  # 7 days
defaultRetentionSizeInMB=1024

# Enable message deduplication for reliability
brokerDeduplicationEnabled=true
brokerDeduplicationMaxNumberOfProducers=1000

# Storage and performance
managedLedgerDefaultEnsembleSize=3
managedLedgerDefaultWriteQuorum=2
managedLedgerDefaultAckQuorum=2
managedLedgerMaxEntriesPerLedger=50000
managedLedgerMinLedgerRolloverTimeMinutes=10
managedLedgerMaxLedgerRolloverTimeMinutes=240

# Message expiry
ttlDurationDefaultInSeconds=0

# Enable auto topic creation
allowAutoTopicCreation=true
allowAutoTopicCreationType=partitioned
defaultNumPartitions=3

# Backlog quota configuration
backlogQuotaDefaultLimitGB=10
backlogQuotaDefaultRetentionPolicy=producer_request_hold

# Load balancer
loadBalancerEnabled=true
loadBalancerSheddingEnabled=true
loadBalancerSheddingIntervalMinutes=1

# Replication
replicationConnectionsPerBroker=16
replicationProducerQueueSize=1000

# Security (configure TLS certificates for production)
# tlsEnabled=true
# tlsCertificateFilePath=/path/to/broker-cert.pem
# tlsKeyFilePath=/path/to/broker-key.pem
# tlsTrustCertsFilePath=/path/to/ca-cert.pem

# Authentication and Authorization (configure for production)
# authenticationEnabled=true
# authenticationProviders=org.apache.pulsar.broker.authentication.AuthenticationProviderToken
# authorizationEnabled=true
# superUserRoles=admin

# Transaction coordinator
transactionCoordinatorEnabled=true

# Metrics
exposeTopicLevelMetricsInPrometheus=true
exposeConsumerLevelMetricsInPrometheus=false
exposeProducerLevelMetricsInPrometheus=false

# System topic
systemTopicEnabled=true
topicLevelPoliciesEnabled=true
