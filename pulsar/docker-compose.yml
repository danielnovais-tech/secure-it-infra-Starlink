version: '3.8'

services:
  # ZooKeeper - coordination service for Pulsar
  zookeeper:
    image: apachepulsar/pulsar:3.2.0
    container_name: pulsar-zookeeper
    restart: unless-stopped
    networks:
      - pulsar-network
    volumes:
      - zookeeper-data:/pulsar/data/zookeeper
    environment:
      - PULSAR_MEM=-Xms256m -Xmx256m
    command: >
      bash -c "bin/apply-config-from-env.py conf/zookeeper.conf &&
               bin/generate-zookeeper-config.sh conf/zookeeper.conf &&
               exec bin/pulsar zookeeper"
    healthcheck:
      test: ["CMD", "bin/pulsar-zookeeper-ruok.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Initialize cluster metadata
  pulsar-init:
    image: apachepulsar/pulsar:3.2.0
    container_name: pulsar-init
    hostname: pulsar-init
    networks:
      - pulsar-network
    command: >
      bin/pulsar initialize-cluster-metadata \
        --cluster pulsar-cluster \
        --zookeeper zookeeper:2181 \
        --configuration-store zookeeper:2181 \
        --web-service-url http://broker:8080 \
        --broker-service-url pulsar://broker:6650
    depends_on:
      zookeeper:
        condition: service_healthy

  # BookKeeper - storage layer for Pulsar
  bookkeeper:
    image: apachepulsar/pulsar:3.2.0
    container_name: pulsar-bookkeeper
    restart: unless-stopped
    networks:
      - pulsar-network
    environment:
      - PULSAR_MEM=-Xms512m -Xmx512m
      - dbStorage_writeCacheMaxSizeMb=256
      - dbStorage_readAheadCacheMaxSizeMb=256
      - journalMaxSizeMB=2048
    depends_on:
      zookeeper:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
    volumes:
      - bookkeeper-data:/pulsar/data/bookkeeper
    command: >
      bash -c "bin/apply-config-from-env.py conf/bookkeeper.conf &&
               exec bin/pulsar bookie"
    healthcheck:
      test: ["CMD", "bin/bookkeeper", "shell", "bookiesanity"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Pulsar Broker - message broker
  broker:
    image: apachepulsar/pulsar:3.2.0
    container_name: pulsar-broker
    hostname: broker
    restart: unless-stopped
    networks:
      - pulsar-network
    environment:
      - PULSAR_MEM=-Xms512m -Xmx512m
      - managedLedgerDefaultEnsembleSize=1
      - managedLedgerDefaultWriteQuorum=1
      - managedLedgerDefaultAckQuorum=1
    depends_on:
      zookeeper:
        condition: service_healthy
      bookkeeper:
        condition: service_healthy
    ports:
      - "6650:6650"   # Pulsar protocol
      - "8080:8080"   # HTTP admin API
    volumes:
      - broker-data:/pulsar/data
    command: >
      bash -c "bin/apply-config-from-env.py conf/broker.conf &&
               exec bin/pulsar broker"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/brokers/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Pulsar Manager - web UI for Pulsar management
  pulsar-manager:
    image: apachepulsar/pulsar-manager:v0.4.0
    container_name: pulsar-manager
    restart: unless-stopped
    networks:
      - pulsar-network
    ports:
      - "9527:9527"
      - "7750:7750"
    depends_on:
      broker:
        condition: service_healthy
    environment:
      - SPRING_CONFIGURATION_FILE=/pulsar-manager/pulsar-manager/application.properties

networks:
  pulsar-network:
    driver: bridge

volumes:
  zookeeper-data:
  bookkeeper-data:
  broker-data:
