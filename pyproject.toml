[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starlink-metrics"
version = "1.0.0"
description = "Comprehensive connection metrics monitoring for Starlink satellite internet"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["starlink", "metrics", "monitoring", "network", "satellite", "prometheus", "cloudwatch"]
authors = [
  {name = "Starlink Metrics Team"}
name = "secure-it-starlink"
version = "0.1.0"
description = "Comprehensive security tool foundation for Starlink-connected enterprise infrastructures"
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "starlink-security"
version = "1.0.0"
description = "Security solutions for managed enterprise infrastructures supporting Starlink"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Daniel Novais Tech"}
]
keywords = ["security", "starlink", "network", "enterprise", "infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    {name = "Secure IT Infrastructure Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-it-starlink"
version = "1.0.0"
description = "Enterprise-grade security solutions for managed Starlink infrastructures"
authors = [{name = "Secure IT Team"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

]

dependencies = [
    "cryptography>=41.0.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
]
aws = [
    "boto3>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/danielnovais-tech/secure-it-infra-Starlink"
Repository = "https://github.com/danielnovais-tech/secure-it-infra-Starlink"

[tool.setuptools.packages.find]
where = ["."]
include = ["starlink_security*"]
exclude = ["tests*", "examples*"]
]
dependencies = [
    "pyyaml>=6.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/danielnovais-tech/secure-it-infra-Starlink"
Documentation = "https://github.com/danielnovais-tech/secure-it-infra-Starlink/blob/main/README.md"
Repository = "https://github.com/danielnovais-tech/secure-it-infra-Starlink"
"Bug Tracker" = "https://github.com/danielnovais-tech/secure-it-infra-Starlink/issues"

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 120
Repository = "https://github.com/danielnovais-tech/secure-it-infra-Starlink"
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.scripts]
secure-it-starlink = "secure_it_starlink.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["secure_it_starlink*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    ".",
]
python_files = "test_*.py"
disallow_untyped_defs = true
addopts = "-v --tb=short"
